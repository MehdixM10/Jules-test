{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
    <h1>Blog Posts</h1>
    {% if posts %}
        <ul>
            {% for post in posts %}
                <li>
                    <h2><a href="{{ url_for('post', post_id=post.id) }}">{{ post.title }}</a></h2>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No posts yet. <a href="{{ url_for('create_post') }}">Create one!</a></p>
    {% endif %}
{% endblock %}
